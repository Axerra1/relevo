<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#07090B;color:#EEF3F6;font-family:"Archivo",sans-serif;overflow:hidden;position:relative}
  body::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(#1E272F 1px,transparent 1px),linear-gradient(90deg,#1E272F 1px,transparent 1px);
    background-size:60px 60px;opacity:.35;mask-image:radial-gradient(ellipse at 80% 40%,#000 10%,transparent 60%)}
  .z{position:relative;z-index:1;height:100%;padding:70px 76px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:16px;font:800 24px "Archivo";letter-spacing:.2em}
  .top b{color:#FF4D3D}
  h1{margin-top:auto;font:900 92px/.98 "Archivo";letter-spacing:-.045em}
  h1 span{color:#FF4D3D}
  p{margin-top:24px;font:600 30px "Archivo";color:#8595A1}
  .sim{position:absolute;z-index:0;right:70px;top:90px;width:300px;height:300px}
</style>
</head>
<body>
  <div class="z">
    <div class="top">
      <svg viewBox="0 0 120 120" width="52" height="52"><path d="M103.30 35 A50 50 0 1 1 35 16.70" fill="none" stroke="#EEF3F6" stroke-width="9" stroke-linecap="round" opacity=".5"/><path d="M34.02 75 A30 30 0 1 1 75 85.98" fill="none" stroke="#EEF3F6" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="60" r="13" fill="#FF4D3D"/></svg>
      RELEVO <b>RADIO</b>
    </div>
    <h1>La radio de trabajo<br>que <span>recuerda.</span></h1>
    <p>Seguridad privada · Construcción · Eventos</p>
  </div>
  <svg class="sim" viewBox="0 0 120 120"><path d="M103.30 35 A50 50 0 1 1 35 16.70" fill="none" stroke="#EEF3F6" stroke-width="7" stroke-linecap="round" opacity=".18"/><path d="M34.02 75 A30 30 0 1 1 75 85.98" fill="none" stroke="#EEF3F6" stroke-width="7" stroke-linecap="round" opacity=".28"/><circle cx="60" cy="60" r="12" fill="#FF4D3D" opacity=".85"/></svg>
</body>
</html>
